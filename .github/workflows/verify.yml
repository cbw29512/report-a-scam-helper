name: Verify static scam report helper
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Verify form-first design and safety requirements
        run: node scripts/verify-site.mjs
      - name: Test required answers and report generation
        run: node scripts/verify-validation.mjs
